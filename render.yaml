# Render Blueprint for TripAgent.
#
# Apply it at: Render Dashboard -> New + -> Blueprint -> connect this repo -> Apply.
# It creates two services:
#   tripagent-api-<owner>  — FastAPI backend (web service)
#   tripagent-web-<owner>  — Svelte frontend (static site)
#
# The names include the repo owner because `onrender.com` subdomains are global:
# `tripagent-web` and `tripagent-api` are already used by other accounts, so a
# generic name would collide (or quietly point the frontend at someone else's
# service). If Render reports a name is taken, change it in BOTH services below
# — the frontend's VITE_API_BASE follows the API service by name.
#
# Free plan notes: the web service spins down after ~15 min idle, so the first
# request after a pause takes a few seconds. The static site is always fast.
# Secrets are `sync: false`, so Render prompts for them and never stores them in
# the repo.

services:
  - type: web
    name: tripagent-api-lavanyabansal03
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # true = use the recorded/mock providers (no keys needed). Set to false
      # once the provider keys below are supplied and the live tools are wired.
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///./tripagent.db
      # The API has no cookies/auth, so any origin may call it. Tighten to the
      # frontend URL once it is known.
      - key: CORS_ORIGINS
        value: "*"
      - key: GOOGLE_API_KEY
        sync: false
      - key: MAPBOX_SECRET_TOKEN
        sync: false
      - key: FOURSQUARE_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false

  - type: web
    name: tripagent-web-lavanyabansal03
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # true = the app runs on recorded data (full flow, works without the API).
      # Set to false to call the live API; the header then shows the backend
      # status and the "Demo mode" note/badge disappear.
      - key: VITE_DEMO_MODE
        value: "true"
      # Resolved to the API service's host (e.g. tripagent-api-xxx.onrender.com).
      # The client adds https:// when the scheme is missing.
      - key: VITE_API_BASE
        fromService:
          type: web
          name: tripagent-api-lavanyabansal03
          property: host
      # Public, URL-restricted Mapbox token (safe to expose). Optional.
      - key: VITE_MAPBOX_PUBLIC_TOKEN
        sync: false
    routes:
      # SPA fallback: serve the app for any path.
      - type: rewrite
        source: /*
        destination: /index.html
